name: Synchronize qualified aerynOS channel
on:
  workflow_dispatch:
    inputs:
      retry_now:
        description: Retry a failed candidate immediately after fixing qualification tooling
        type: boolean
        default: false
  workflow_call:
permissions:
  contents: read
concurrency:
  group: aerynos-qualified-feed
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      verify_public: ${{ steps.plan.outputs.verify_public }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      core_producer_run_id: ${{ steps.plan.outputs.core_producer_run_id }}
      core_tag: ${{ steps.plan.outputs.core_tag }}
      core_release_id: ${{ steps.plan.outputs.core_release_id }}
      core_run_id: ${{ steps.plan.outputs.core_run_id }}
      core_source_sha: ${{ steps.plan.outputs.core_source_sha }}
      core_linux_sha256: ${{ steps.plan.outputs.core_linux_sha256 }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate controller
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Resolve published release and original Linux producer
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RETRY: ${{ inputs.retry_now && 'true' || 'false' }}
        run: python3 scripts/releases.py reconcile
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: snapetech-org/pleazyng
          ref: ${{ needs.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: snapetech-org/pleazyng
          ref: main
          path: tooling
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify and stage the published Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CORE_LINUX_SHA256: ${{ needs.plan.outputs.core_linux_sha256 }}
          PRODUCER_RUN_ID: ${{ needs.plan.outputs.core_producer_run_id }}
        run: |
          python3 scripts/stage_release.py --source source --tooling tooling \
            --tag "$CORE_TAG" --sha256 "$CORE_LINUX_SHA256" \
            --source-sha "$SOURCE_SHA" --producer-run-id "$PRODUCER_RUN_ID" \
            --output "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aerynos-candidate-${{ needs.plan.outputs.source_sha }}
          path: ${{ runner.temp }}/candidate/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
  qualify:
    needs: [plan, build]
    if: needs.build.result == 'success'
    permissions:
      contents: read
      actions: read
    uses: snapetech-org/pleazyng/.github/workflows/aerynos-qualify.yml@6343663ca38e8760c60f0a94d1996e8cce52f59a
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      release: ${{ fromJSON(needs.plan.outputs.release || '2') }}
      producer_run_id: ""
  publish:
    needs: [plan, qualify]
    if: ${{ always() && needs.plan.outputs.build == 'true' && needs.qualify.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aerynos-qualified-${{ needs.plan.outputs.source_sha }}
          path: ${{ runner.temp }}/qualified
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish immutable assets and atomically promote feed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          CORE_RELEASE_ID: ${{ needs.plan.outputs.core_release_id }}
          CORE_RUN_ID: ${{ needs.plan.outputs.core_run_id }}
          CORE_SOURCE_SHA: ${{ needs.plan.outputs.core_source_sha }}
          CORE_LINUX_SHA256: ${{ needs.plan.outputs.core_linux_sha256 }}
          CORE_PRODUCER_RUN_ID: ${{ needs.plan.outputs.core_producer_run_id }}
        run: |
          python3 scripts/releases.py bind "$RUNNER_TEMP/qualified"
          python3 scripts/control.py publish "$RUNNER_TEMP/qualified"
  retain-last-good:
    needs: [plan, build, qualify, publish]
    if: ${{ always() && needs.plan.outputs.build == 'true' && needs.publish.result != 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record failure without changing the feed
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          python3 scripts/control.py fail "$SOURCE_SHA"
          exit 1

  verify-public:
    needs: [plan, publish]
    if: ${{ always() && needs.plan.outputs.verify_public == 'true' && (needs.publish.result == 'success' || (needs.plan.outputs.build != 'true' && needs.publish.result == 'skipped')) }}
    permissions:
      contents: write
    uses: ./.github/workflows/verify-public.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      core_tag: ${{ needs.plan.outputs.core_tag }}
